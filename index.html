<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ioana Dobrin — Graphic designer & fine artist</title>
    <meta name="description" content="Portfolio of Ioana Dobrin — fashion licensing, graphic design, illustration and fine art." />

    <!-- How the site looks when someone shares a link. These are static, so
         every page previews as the site itself: a single-page app has no
         server to write per-project tags, which would need prerendering. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ioana Dobrin" />
    <meta property="og:title" content="Ioana Dobrin — Graphic designer & fine artist" />
    <meta property="og:description" content="Fashion licensing, graphic design, illustration and fine art." />
    <meta property="og:url" content="https://www.ioanadobrin.com/" />
    <meta property="og:image" content="https://www.ioanadobrin.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pattern, print & paint. — Ioana Dobrin, graphic designer and fine artist" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
